name: Live feed

# Checks ESPN, MLB Trade Rumors and MLB's official transactions every 10 minutes
# and commits any new moves (transactions.json) and stories (news.json).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_feed.py', '.github/workflows/live-feed.yml']

permissions:
  contents: write

concurrency:
  group: live-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull sources
        run: python3 scripts/update_feed.py
      - name: Commit and publish if anything changed
        run: |
          git config user.name "hotstove-feed[bot]"
          git config user.email "fschaeffer16@users.noreply.github.com"
          git add transactions.json news.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Live feed $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && git push --force origin HEAD:gh-pages && break
            sleep 5
          done
