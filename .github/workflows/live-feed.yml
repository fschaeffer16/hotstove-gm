name: Live feed

# Checks ESPN, MLB Trade Rumors and MLB's official transactions every 10 minutes
# and commits any new moves (transactions.json) and stories (news.json).
#
# GitHub delays and skips scheduled runs on low-traffic repos (it ran only 3 times
# in 24 hours on 11/17-18), so the job keeps itself alive: one run loops for about
# 5.5 hours, checking every 10 minutes, then starts the next run itself.
# The schedule is only a backup that restarts the loop if the chain ever breaks.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_feed.py', '.github/workflows/live-feed.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: live-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the feeds every 10 minutes for ~5.5 hours
        run: |
          git config user.name "hotstove-feed[bot]"
          git config user.email "fschaeffer16@users.noreply.github.com"
          end=$((SECONDS + 330*60))
          while [ $SECONDS -lt $end ]; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/update_feed.py || echo "feed script failed; trying again next round"
            git add transactions.json news.json
            if git diff --cached --quiet; then
              echo "$(date -u +%H:%M) no changes"
            else
              git commit -q -m "Live feed $(date -u +'%Y-%m-%d %H:%M UTC')"
              for i in 1 2 3; do
                git pull -q --rebase origin main && git push -q origin HEAD:main && git push -q --force origin HEAD:gh-pages && break
                sleep 5
              done
              echo "$(date -u +%H:%M) published"
            fi
            sleep 600
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-feed.yml --repo "$GITHUB_REPOSITORY" --ref main
