<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Hot Stove GM</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hot Stove GM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1a33">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Team colors: --team1 (dark primary) and --team2 (accent) are set by script when a team is picked; Mets defaults here */
:root{
  /* Layout: scoreboard header, then depth chart | 40-man | CBT ledger, then a tabbed moves desk below */
  --team1:#1d4fb8; --team2:#e8601c; --team2-ink:#ffffff; --team2-text:#c9521a; --team-deep:#0a2254;
  --ink:#0d1b38; --paper:#f3f5f9; --card:#ffffff; --line:#d5dbe6; --muted:#5d6a82;
  --accent:var(--team2); --accent-ink:var(--team2-ink); --accent-text:var(--team2-text); --navy:var(--team1);
  --good:#1d7f47; --warn:#a86f00; --bad:#b3261e;
  --chip:#e9edf4; --sel:color-mix(in srgb,var(--team2) 12%,#fff); --blue:var(--team1); --on-blue:#ffffff;
  --blue-soft:color-mix(in srgb,var(--team1) 12%,#fff); --org-soft:color-mix(in srgb,var(--team2) 16%,#fff);
  --cl:#c8312a; --w4:#16794a; --w3:#3c9a5f; --w2:#b98100; --w1:#8a94a8; --tint:color-mix(in srgb,var(--team1) 7%,#f3f5f9);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6ebf5; --paper:#0b1224; --card:#131c33; --line:#26324f; --muted:#97a3bd;
    --accent:color-mix(in srgb,var(--team2) 80%,#fff); --accent-ink:#14100c; --accent-text:color-mix(in srgb,var(--team2) 75%,#fff); --navy:color-mix(in srgb,var(--team1) 45%,#fff);
    --good:#4cc27f; --warn:#e0ad3a; --bad:#ff6b5f; --chip:#1c2742; --sel:color-mix(in srgb,var(--team2) 22%,#131c33);
    --blue:color-mix(in srgb,var(--team1) 50%,#fff); --on-blue:#0b1224;
    --blue-soft:color-mix(in srgb,var(--team1) 35%,#131c33); --org-soft:color-mix(in srgb,var(--team2) 25%,#131c33);
    --cl:#ff5a4f; --w4:#3fcf7f; --w3:#7fd49b; --w2:#e8b84a; --w1:#7f8aa3; --tint:color-mix(in srgb,var(--team1) 18%,#0b1224);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e6ebf5; --paper:#0b1224; --card:#131c33; --line:#26324f; --muted:#97a3bd;
  --accent:color-mix(in srgb,var(--team2) 80%,#fff); --accent-ink:#14100c; --accent-text:color-mix(in srgb,var(--team2) 75%,#fff); --navy:color-mix(in srgb,var(--team1) 45%,#fff);
  --good:#4cc27f; --warn:#e0ad3a; --bad:#ff6b5f; --chip:#1c2742; --sel:color-mix(in srgb,var(--team2) 22%,#131c33);
  --blue:color-mix(in srgb,var(--team1) 50%,#fff); --on-blue:#0b1224;
  --blue-soft:color-mix(in srgb,var(--team1) 35%,#131c33); --org-soft:color-mix(in srgb,var(--team2) 25%,#131c33);
  --cl:#ff5a4f; --w4:#3fcf7f; --w3:#7fd49b; --w2:#e8b84a; --w1:#7f8aa3; --tint:color-mix(in srgb,var(--team1) 18%,#0b1224);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--tint);color:var(--ink);font:14px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
h2{font-size:20px;text-transform:uppercase}
h3{font-size:15px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px 40px}

/* header */
header.top{background:linear-gradient(115deg,var(--team-deep) 0%,var(--team1) 60%,color-mix(in srgb,var(--team1) 80%,#fff) 100%);color:#fff;padding:12px 16px;border-bottom:5px solid var(--team2)}
:root[data-theme="dark"] header.top{background:linear-gradient(115deg,color-mix(in srgb,var(--team-deep) 80%,#000),var(--team-deep) 70%,var(--team1))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:linear-gradient(115deg,color-mix(in srgb,var(--team-deep) 80%,#000),var(--team-deep) 70%,var(--team1))}}
.top-in{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:64px;height:64px;border-radius:14px;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.brand h1{font-size:30px;line-height:1}
.brand h1 .tm{font-size:.62em;opacity:.92;margin-left:6px;white-space:nowrap}
@media (max-width:560px){.logo{width:52px;height:52px;border-radius:12px}}
.brand h1 em{font-style:normal;color:var(--team2-hi,#ff8a4c)}
.brand p{margin:4px 0 0;font-size:12px;opacity:.9;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.teampick{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:4px 8px;font-weight:600;font-size:13px}
.teampick option{color:#111}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 10px;min-width:96px}
.tile b{display:block;font-family:var(--mono);font-size:17px;font-weight:600}
.tile span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.tile.cbt{background:color-mix(in srgb,var(--team2) 35%,transparent);border-color:color-mix(in srgb,var(--team2) 70%,#fff)}
.tile.alert{border-color:#ffb38a;background:rgba(232,96,28,.25)}
.tile.sm{padding:4px 8px;min-width:0}
.tile.sm b{font-size:14px}
.tile.sm span{font-size:9.5px}
@media (max-width:560px){.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}.tile{min-width:0}.tile.sm{display:flex;align-items:baseline;gap:5px;padding:4px 7px}.tile.sm b{display:inline;font-size:13px}.tile.sm span{font-size:9px;letter-spacing:.03em}}
.topnav{position:sticky;top:0;z-index:30;background:var(--team-deep);border-bottom:2px solid var(--team2);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.topnav-in{max-width:1500px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 10px;-webkit-overflow-scrolling:touch}
.topnav-in::-webkit-scrollbar{display:none}
.topnav button{flex:0 0 auto;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.03em;padding:7px 13px;white-space:nowrap}
.topnav button[aria-selected="true"]{background:var(--team2);color:var(--team2-ink)}
.desk,.grid,.cbtcol{scroll-margin-top:58px}
.cardhead{cursor:pointer;user-select:none}
.cardhead h2::after{content:"▾";display:inline-block;margin-left:8px;font-size:.7em;opacity:.55;transition:transform .15s}
.card.collapsed .cardhead h2::after{transform:rotate(-90deg)}
.card.collapsed>:not(.cardhead){display:none!important}
.card.collapsed .cardhead{margin-bottom:0}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn.ghost:hover{border-color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.banner{max-width:1500px;margin:10px auto 0;padding:0 16px}
.banner div{background:var(--sel);border:1px solid var(--accent);border-radius:6px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* main grid */
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr) minmax(0,.95fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:1150px){.grid{grid-template-columns:1fr 1fr}.grid .cbtcol{grid-column:1 / -1}}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:8px;padding:14px}
.card.c-rot,.card.c-cbt{border-top-color:var(--accent)}
.card.c-pen{border-top-color:var(--cl)}
.card h2{color:var(--navy)}
.card.c-rot h2,.card.c-cbt h2{color:var(--accent-text)}
.card.c-pen h2{color:var(--cl)}
.card + .card{margin-top:16px}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cnt{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip)}
.cnt.ok{color:var(--good)} .cnt.bad{color:var(--bad)}

/* slots */
.slots{display:grid;gap:4px}
.slot{display:grid;grid-template-columns:30px 52px minmax(0,1fr) auto;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:6px;padding:5px 6px;min-height:40px;background:var(--paper)}
.slot.filled{border-style:solid;background:var(--card)}
.slot.over{border-color:var(--accent);background:var(--sel)}
.grip{display:flex;flex-direction:column;align-items:center;justify-content:center;align-self:stretch;margin:-5px 0 -5px -6px;padding:0 2px 0 4px;border-radius:5px 0 0 5px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;color:var(--muted);line-height:1}
.grip b{font-family:var(--display);font-size:15px;color:var(--ink,inherit)}.grip i{font-style:normal;font-size:13px;letter-spacing:-2px;opacity:.7}
.grip:not(.off):active{cursor:grabbing;background:var(--sel)}.grip.off{cursor:default}
.slot.dragsrc{opacity:.35}.dragghost{position:fixed;z-index:9999;pointer-events:none;opacity:.95;box-shadow:0 8px 24px rgba(0,0,0,.35);transform:rotate(-1deg)}
.war{display:inline-block;min-width:30px;text-align:center;font:600 11px var(--mono);color:#fff;border-radius:3px;padding:0 4px;margin-right:4px;vertical-align:1px}
.war.w4{background:var(--w4)}.war.w3{background:var(--w3)}.war.w2{background:var(--w2)}.war.w1{background:var(--w1)}
.fv{display:inline-block;min-width:30px;text-align:center;font:600 11px var(--mono);border-radius:3px;padding:0 4px;color:#fff;background:var(--w1)}
.fv.f55{background:#7b3fc4}.fv.f50{background:var(--blue);color:var(--on-blue)}.fv.f45{background:var(--w3)}.fv.f40{background:var(--w2)}
.slot.flag{box-shadow:inset 3px 0 0 var(--warn)}
.slot .lbl{font-family:var(--display);font-weight:700;font-size:16px;text-align:center;border-radius:4px;background:var(--blue);color:var(--on-blue);padding:2px 0;border:0;width:100%}
.slot[data-slot^="B"] .lbl{background:var(--blue-soft);color:var(--blue)}
.slot[data-slot^="R"] .lbl{background:var(--accent);color:var(--accent-ink)}
.slot.depth .lbl{background:var(--org-soft);color:var(--accent-text)}
.slot .lbl.r-CL{background:var(--cl);color:#fff}
.slot .lbl.r-SU{background:var(--accent);color:var(--accent-ink)}
.slot .lbl.r-MD{background:var(--blue);color:var(--on-blue)}
.slot .lbl.r-LG,.slot .lbl.r-LR,.slot .lbl.r-RP{background:var(--blue-soft);color:var(--blue)}
.slot.filled:hover{border-color:var(--blue)}
select.lbl{appearance:none;cursor:pointer;text-align-last:center}
.slot .who{min-width:0}
.slot .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.slot .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .empty{color:var(--muted);font-size:12.5px;font-style:italic}
.x{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--chip)}
.sep{height:6px}
.depthnote{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 4px}
.warnlist{margin:8px 0 0;padding:0;list-style:none;font-size:12.5px}
.warnlist li{color:var(--warn);padding:2px 0}
.warnlist li.ok{color:var(--good)}

/* 40-man list */
.grp{margin-top:8px}
.grp:first-child{margin-top:0}
.grp h3{font-size:12px;margin-bottom:3px;display:flex;justify-content:space-between;padding:3px 6px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
.grp.g-P h3{background:var(--org-soft);color:var(--accent-text)}
.grp.g-IL h3{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:4px 6px;border-radius:5px;cursor:pointer;border:1px solid transparent}
.prow:hover{background:var(--chip)}
.prow.sel{background:var(--sel);border-color:var(--accent)}
.prow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pos{font-size:11px;font-family:var(--mono);font-weight:600;padding:0 5px;border-radius:3px;background:var(--blue-soft);color:var(--blue)}
.prow .pos.pp{background:var(--org-soft);color:var(--accent-text)}
.prow .sal{font-size:12px;font-family:var(--mono);color:var(--muted);min-width:58px;text-align:right}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px}
.dot.off{background:transparent;border:1px solid var(--muted)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:0 5px;border-radius:3px;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:1px;text-transform:uppercase;letter-spacing:.03em}
.tag.inj{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.tag.rep{background:transparent;color:var(--accent-text);border:1px solid var(--accent);margin:0 6px 0 0}
.tag.off{background:#1f7a3a;color:#fff;margin:0 6px 0 0}
.tdwrap .chips button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:700;color:var(--muted)}.tdwrap .chips button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.tdday{margin-top:18px;padding-top:12px;border-top:3px solid var(--blue)}.tdday h3{margin:0}.tdday h3 .hint{font-weight:400;font-size:13px;margin-left:6px}.tdgrp{margin-top:10px}.tdmore{margin-top:8px;border:1px solid var(--line);background:var(--paper);color:var(--blue);font-weight:700;font-size:13.5px;border-radius:999px;padding:6px 14px;cursor:pointer}.tdlist{list-style:none;margin:4px 0 0;padding:0}.tdlist li{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);line-height:1.35}.tdlist li.mine{background:var(--chip);margin:0 -6px;padding:7px 6px;border-radius:4px}
.tdt{display:flex;gap:3px;flex:none;width:76px;flex-wrap:wrap}.tdteam{display:inline-block;min-width:34px;text-align:center;font:700 11px/18px var(--display,inherit);color:#fff;border-radius:3px;letter-spacing:.03em}
.seg.tview{margin:0 0 12px}.txhist{margin-top:16px}.txhist summary{cursor:pointer;font-weight:700;color:var(--muted)}
.news{list-style:none;margin:0;padding:0}.news li{padding:9px 0;border-bottom:1px solid var(--line)}.news .nh{font-weight:600;line-height:1.35}.news a{color:inherit;text-decoration:none}.news a:hover{text-decoration:underline}
.tag.qo{color:var(--warn);border:1px solid var(--warn);background:transparent}

/* CBT */
.big{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1.05;color:var(--navy)}
.big small{font-size:14px;color:var(--muted);font-weight:500}
.statline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--chip)}
.pill.good{color:var(--good);border-color:var(--good)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)}
.bar{position:relative;height:34px;margin:16px 0 22px;border-radius:5px;background:linear-gradient(90deg,var(--chip) 0 100%)}
.bar .band{position:absolute;top:0;bottom:0}
.bar .tick{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--muted)}
.bar .tick span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:11px var(--mono);color:var(--muted);margin-top:3px;white-space:nowrap}
.bar .marker{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--accent);border-radius:2px}
.bar .marker span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:600 11px var(--mono);color:var(--accent-text);white-space:nowrap;margin-bottom:2px}
.bar .base{position:absolute;top:4px;bottom:4px;width:2px;background:var(--navy);opacity:.5}
table.ledger{width:100%;border-collapse:collapse;font-size:13px}
.ledger td{padding:3px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ledger td.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
.ledger tr.sub td{color:var(--muted);font-size:12px;padding-left:12px;border-bottom-style:dotted}
.ledger tr.tot td{font-weight:600;border-bottom:2px solid var(--ink)}
.ledger tr.hd td{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:10px}
.plus{color:var(--bad)} .minus{color:var(--good)}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:8px}

/* tabs desk */
.desk{margin-top:16px}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--accent);flex-wrap:wrap}
.seg{display:flex;margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--paper);padding:8px 6px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tside .chips{flex-wrap:nowrap;gap:4px}.tside .chips button{flex:1;padding:6px 0;font-size:12.5px;min-width:0}
.tside.team{border:1px solid color-mix(in srgb,var(--tc1) 55%,var(--line));padding:0;overflow:hidden}
.tside.team .tbody{padding:10px}
.tside .thead{background:linear-gradient(110deg,color-mix(in srgb,var(--tc1) 70%,#000) 0%,var(--tc1) 70%,color-mix(in srgb,var(--tc1) 80%,#fff) 100%);border-bottom:4px solid var(--tc2);padding:10px 12px;color:#fff}
.tside .thead h3{color:#fff;margin:0;font-size:20px}
.tside .thead .hint{color:rgba(255,255,255,.8);margin:2px 0 0}
.tside.team .seg button[aria-pressed="true"]{background:var(--tc1);color:#fff;box-shadow:inset 0 -3px 0 var(--tc2)}
.tside.team .chips button[aria-pressed="true"]{background:var(--tc2);border-color:var(--tc2);color:var(--tc2ink)}
.tside .thead{cursor:pointer;position:relative;padding-right:34px}
.tside .thead .chev{display:none}
.tside .thead .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;color:#fff;opacity:.85}
.tside .tfold{padding:8px 12px 10px}.tside .tfold .subh{font-size:11px;margin:0 0 4px;letter-spacing:.06em}
.tside .tfold .kv{font-size:13px;padding:2px 0}.tside .tfold .kv .hint{font-size:11.5px}

.decision{margin-top:12px;border:2px solid var(--line);border-radius:8px;padding:12px;background:var(--card)}

<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <img class="logo" src="logo.png" alt="Hot Stove GM logo, back to top" width="64" height="64" data-goto="home" style="cursor:pointer">
      <div>
      <h1>Virtual Hot Stove GM <span class="tm"><span id="hTeam">Mets</span> <em>2027</em></span></h1>
      <p><label for="teamPick" class="sr">Team</label><select id="teamPick" class="teampick" aria-label="Team you are running"></select> Fangraphs payroll &amp; Roster Resource · 40-man rosters 11/17 · free sandbox</p>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="actions">
      <button class="btn ghost" id="bUndo" type="button">Undo</button>
      <button class="btn ghost" id="bReset" type="button">Reset to baseline</button>
    </div>
  </div>
</header>
<nav class="topnav" id="topnav" aria-label="Sections"><div class="topnav-in" id="topnavIn"></div></nav>
<div class="banner" id="selBanner" hidden></div>
<div class="wrap" id="app"><div class="loading">Loading roster data…</div></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Player detail"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const KEY='nym-gm-sandbox-v1';
const RATE_DEFAULT=4.5;
let ME='NYM',BASE_T=0,IL60=new Set();
const MEN=()=>D.teams[ME].name;
const skey=()=>ME==='NYM'?KEY:KEY+'-'+ME;
let D,P,S,HIST=[],UI={g40:'P',gMin:'All',tGrp:{out:null,in:null},tFold:{out:false,in:false},tTried:'',tPF:{out:'All',in:'All'},tPk:new Set(),tIfa:0,tab:'hub',homeTab:'fa',sel:null,faPos:'All',faQ:'',faSort:'pwar',faDir:-1,tTeam:'ATL',prQ:'',prTeam:'All',prPos:'All',prSort:'rank',tOut:new Set(),tIn:new Set(),tAdd40:new Set(),tCash:0,tQout:'',tQin:'',pQ:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=v=>'$'+(v/1e6).toFixed(2)+'M';
const M1=v=>'$'+(v/1e6).toFixed(1)+'M';
const sgn=v=>(v>0?'+':v<0?'−':'')+'$'+(Math.abs(v)/1e6).toFixed(2)+'M';
const today=()=>{const d=new Date();return (d.getMonth()+1)+'/'+d.getDate()};

/* ---------- state ---------- */
function baseline(){
  return {team:{},status:{},contract:{},dead:[],cash:0,teamAdj:{},
    ...baseSlots(),
    top:initTop(),log:[],created:{}};
}
function baseSlots(){
  const b=ME==='NYM'?{lineup:D.lineup,bench:D.bench,rot:D.rot,pen:D.pen}:D.base[ME];
  return {lineup:b.lineup.map(x=>[x[0],x[1]]),bench:b.bench.map(x=>[x[0],x[1]]),rot:b.rot.slice(),pen:b.pen.map(x=>[x[0],x[1]])};
}
function initTop(){
  if(true){const r=hsRanks();return r.__ids.filter(id=>P[id].team===ME)}
  if(ME==='NYM'){
    const rest=Object.values(P).filter(p=>p.team==='NYM'&&p.fv&&!D.top50.includes(p.id)).sort((a,b)=>fvn(b.fv)-fvn(a.fv));
    return D.top50.concat(rest.map(p=>p.id));
  }
  const sc=p=>p.mlbp?(p.ork?(p.ork+p.mlbp)/2:p.mlbp):(p.ork||200);
  return Object.values(P).filter(p=>p.team===ME&&p.fv).sort((a,b)=>sc(a)-sc(b)||fvn(b.fv)-fvn(a.fv)).map(p=>p.id);
}
function save(){try{localStorage.setItem(skey(),JSON.stringify(S));localStorage.setItem('gm-last-team',ME)}catch(e){}}
function load(){try{const s=localStorage.getItem(skey());if(s){const o=JSON.parse(s);if(o&&o.lineup)return o}}catch(e){}return null}
function snap(){HIST.push(JSON.stringify(S));if(HIST.length>80)HIST.shift()}
function commit(){R5AUTO={};userFA();if(S&&S.rot)tidyDepth();save();render()}

/* ---------- player helpers ---------- */
const fvn=f=>{if(!f)return 0;const n=parseFloat(f);return n+(String(f).includes('+')?.5:0)};
const owner=id=>S.team[id]??P[id].team;
const aav=id=>S.contract[id]?S.contract[id].aav:(P[id].aav||0);
const kind=id=>S.contract[id]?'guar':P[id].kind;
const forty=new Set();
function status(id){if(S.status[id])return S.status[id];return forty.has(id)?'40':IL60.has(id)?'IL60':'MiLB'}
function isMets(id){return owner(id)===ME}
function metsIds(){const s=new Set(BASE_METS);for(const k in S.team)s.add(k);return [...s].filter(isMets)}
let BASE_METS=[];
function cbtOf(id){
  const k=kind(id),st=status(id);
  if(k==='guar')return aav(id);
  if(k==='arb')return (st==='40'||st==='IL60')?aav(id):0;
  return 0;
}
function hand(id){return P[id].hand||''}
function isP(id){return !!P[id].p}
function projTxt(id){
  const p=P[id].proj; if(!p)return 'no 2027 projection';
  return p.t==='b'?`${p.war.toFixed(1)} WAR · ${p.wrc} wRC+ · ${p.pa} PA`:`${p.war.toFixed(1)} WAR · ${p.era.toFixed(2)} ERA · ${p.ip} IP`;
}
function warB(w){const c=w>=4?'w4':w>=2.5?'w3':w>=1?'w2':'w1';return `<span class="war ${c}">${w.toFixed(1)}</span>`}
function fvB(f){if(!f)return '';const n=fvn(f);const c=n>=55?'f55':n>=50?'f50':n>=45?'f45':n>=40?'f40':'';return `<span class="fv ${c}">${esc(f)}</span>`}
function pwar(id){return P[id].proj?P[id].proj.war:0}
function grpOf(id){
  if(isP(id))return 'P';
  const f=String(P[id].pos||'').split('/')[0];
  if(f==='C')return 'C';
  if(['1B','2B','3B','SS','INF','IF','MI','CI'].includes(f))return 'IF';
  if(['LF','CF','RF','OF'].includes(f))return 'OF';
  return 'DH';
}
const note=id=>{const x=SE&&SE.il[id];if(x&&x.ret>SE.day)return 'IL: '+x.what+(x.ret>=999?', out for the season':', back about '+seDate(x.ret));return (D.notes||{})[id]||''};

/* ---------- CBT ---------- */
function cbt(){
  const ids=metsIds();let guar=0,arb=0,acq=0;const guarL=[],arbL=[],acqL=[];
  for(const id of ids){
    const v=cbtOf(id);if(!v)continue;
    const orig=P[id].team===ME&&!S.contract[id];
    if(!orig){acq+=v;acqL.push([id,v])}
    else if(kind(id)==='guar'){guar+=v;guarL.push([id,v])}
    else {arb+=v;arbL.push([id,v])}
  }
  const dead=S.dead.reduce((a,d)=>a+d.aav,0);
  const fixed=Object.values(fixedItems()).reduce((a,b)=>a+b,0);
  const total=guar+arb+acq+dead+fixed+S.cash;
  return {total,guar,arb,acq,dead,fixed,cash:S.cash,guarL:guarL.sort((a,b)=>b[1]-a[1]),arbL:arbL.sort((a,b)=>b[1]-a[1]),acqL:acqL.sort((a,b)=>b[1]-a[1])};
}
function tax(total){return taxFor(total,ME)}
function tierName(total){
  if(total<=258e6)return ['Under threshold','good'];
  if(total<=278e6)return ['1st tier ($258M–$278M)','warn'];
  if(total<=298e6)return ['2nd tier ($278M–$298M)','warn'];
  if(total<=318e6)return ['3rd tier ($298M–$318M)','bad'];
  return ['4th tier (over $318M)','bad'];
}
const BASE_TOTAL=()=>BASE_T;
function fixedItems(){return ME==='NYM'?D.fixed:{'Other payments, pre-arb est., minors, benefits & bonus pool':D.teams[ME].fixed}}
function flows(){let i=0,o=0;for(const l of S.log){i+=l.inc||0;o+=l.out||0}return [i,o]}

/* ---------- deferral PV & contract math ---------- */
function contractCalc(c){
  const Y=Math.max(1,Math.round(c.years||1)),T=(c.total||0)*1e6,Dd=Math.min(T,(c.deferred||0)*1e6);
  const r=(c.rate??RATE_DEFAULT)/100,start=c.start||2027,ps=c.payStart||(start+Y),N=Math.max(1,Math.round(c.payYears||1));
  let pv=0;
  for(let i=0;i<Y;i++){
    const earned=start+i;
    pv+=(T-Dd)/Y;
    for(let j=0;j<N;j++){const paid=Math.max(earned,ps+j);pv+=(Dd/Y/N)/Math.pow(1+r,paid-earned)}
  }
  const nominal=T/Y,a=pv/Y;
  return {aav:a,nominal,pv,saved:nominal-a,years:Y,total:T};
}

/* ---------- slots ---------- */
/* H = position-player depth, D = bullpen depth, R6+ = rotation depth: all off the 26-man */
function ensureDep(){if(!S.hdep)S.hdep=[];if(!S.pdep)S.pdep=[]}
/* 13 pitchers: 5-man rotation + 8-man bullpen, or 6-man rotation + 7-man bullpen (S.rotN, default 6) */
const RN=()=>S&&S.rotN===5?5:6;
function setRotN(n){if(n===RN())return;snap();ensureDep();
  if(n===5){const id=S.rot[5]||null;S.rot.splice(5,1);S.pen.push(['LR',id]);S.rotN=5}
  else{let i=-1;for(let j=S.pen.length-1;j>=0;j--)if(S.pen[j][0]==='LR'){i=j;break}if(i<0)i=S.pen.length-1;
    const id=i>=0?S.pen.splice(i,1)[0][1]:null;S.rot.splice(5,0,id);S.rotN=6}
  commit();toast(n===5?'5-man rotation + 8-man bullpen. Your SP6 moved to the bullpen as the long man.':'6-man rotation + 7-man bullpen. Your long man moved back to SP6.')}
const SLOTKEYS=()=>{ensureDep();return [...S.lineup.map((_,i)=>'L'+i),...S.bench.map((_,i)=>'B'+i),...S.rot.map((_,i)=>'R'+i),...S.pen.map((_,i)=>'P'+i),...S.hdep.map((_,i)=>'H'+i),...S.pdep.map((_,i)=>'D'+i)]};
function getSlot(k){ensureDep();const t=k[0],i=+k.slice(1);if(t==='L')return S.lineup[i][1];if(t==='B')return S.bench[i][1];if(t==='R')return S.rot[i]||null;if(t==='H')return S.hdep[i]||null;if(t==='D')return S.pdep[i]||null;return S.pen[i][1]}
function setSlot(k,id){ensureDep();const t=k[0],i=+k.slice(1);if(t==='L')S.lineup[i][1]=id;else if(t==='B')S.bench[i][1]=id;else if(t==='R')S.rot[i]=id;else if(t==='H')S.hdep[i]=id;else if(t==='D')S.pdep[i]=id;else S.pen[i][1]=id}
/* tidy depth after every change: no gaps, no duplicates, rotation keeps at least 4 depth slots plus an open one */
function tidyDepth(){ensureDep();const rn=RN(),pn=13-rn;while(S.pen.length<pn)S.pen.push([S.pen.length?'RP':'CL',null]);while(S.pen.length>pn){const x=S.pen.pop();if(x[1])S.pdep.unshift(x[1])}
  const live=new Set([...S.lineup.map(x=>x[1]),...S.bench.map(x=>x[1]),...S.rot.slice(0,rn),...S.pen.map(x=>x[1])].filter(Boolean));
  const uniq=a=>a.filter((x,i)=>x&&!live.has(x)&&a.indexOf(x)===i);
  S.hdep=uniq(S.hdep);S.pdep=uniq(S.pdep);
  const rd=uniq(S.rot.slice(rn));while(rd.length<4)rd.push(null);if(rd.every(Boolean))rd.push(null);
  while(S.rot.length<rn)S.rot.push(null);S.rot=S.rot.slice(0,rn).concat(rd)}
function slotOf(id){return SLOTKEYS().find(k=>getSlot(k)===id)}
function moveSlot(src,dst){
  if(!src||!dst||src===dst)return;
  if(src[0]==='L'&&dst[0]==='L'){snap();const it=S.lineup.splice(+src.slice(1),1)[0];S.lineup.splice(+dst.slice(1),0,it);commit();return}
  const id=getSlot(src);if(id)place(id,dst);
}
function place(id,k){
  const cur=getSlot(k),from=slotOf(id);
  if(from===k)return;
  snap();
  if(from){setSlot(from,cur||null)}
  setSlot(k,id);commit();
}
function clearSlot(k){const id=getSlot(k),t=k[0],i=+k.slice(1);snap();setSlot(k,null);
  if(id){ /* off the 26-man goes to that unit's depth; off a depth list goes back to the 40-man */
    if(t==='L'||t==='B')S.hdep.unshift(id);
    else if(t==='P')S.pdep.unshift(id);
    else if(t==='R'&&i<RN()){S.rot.splice(RN(),0,id)}
  }
  commit()}
function unslot(id){for(const k of SLOTKEYS())if(getSlot(k)===id)setSlot(k,null)}

function insertProspect(id){
  if(!P[id].fv||S.top.includes(id))return;
  const f=hsValue(id);const live=S.top.filter(isMets);

function txTeams(t){const s=new Set();if(t.team)s.add(t.team);(t.players||[]).forEach(m=>{m.from&&s.add(m.from);m.to&&s.add(m.to)});return [...s].filter(c=>D.teams[c])}
const TDGRP=[['trades','Trades',['trade']],['sign','Signings',['sign','sign_minor','extend','extension']],['roster','Roster moves',null]];
function tdGroup(t){for(const [k,,ty] of TDGRP)if(ty&&ty.includes(t.type))return k;return 'roster'}
function todayCount(){const td=etDay(Date.now());return (((TXL||(D&&D.tx)||{}).moves)||[]).filter(m=>m.date===td).length}
function renderMoves(){
  const moves=((TXL||D.tx||{}).moves)||[];const td=etDay(Date.now()),yd=etDay(Date.now()-864e5);
  const f=UI.tdF||'all',mine=m=>txTeams(m).includes(ME);
  const days=[...new Set(moves.map(m=>m.date).filter(Boolean))].sort().reverse();
  const chip=c=>{const [a,b]=COLORS[c]||['#555','#999'];return `<span class="tdteam" style="background:${a};box-shadow:inset 0 -2px 0 ${b}" title="${esc(D.teams[c].name)}">${esc(c)}</span>`};
  const stat=m=>m.status==='official'?'<span class="tag off">official</span>':'<span class="tag rep">reported</span>';
  const row=m=>`<li class="${mine(m)?'mine':''}"><div class="tdt">${txTeams(m).map(chip).join('')}</div><div>${stat(m)}${esc((m.summary||'').replace(/\s+/g,' '))}</div></li>`;
  const grp=(day,list,[k,label])=>{const g=list.filter(m=>tdGroup(m)===k).sort((a,b)=>mine(b)-mine(a));if(!g.length)return '';
    const key=day+':'+k,open=UI.tdAll&&UI.tdAll.has(key),N=5;
    return `<div class="tdgrp"><div class="subh">${label} <span class="hint">${g.length}</span></div><ul class="tdlist">${(open?g:g.slice(0,N)).map(row).join('')}</ul>${g.length>N?`<button type="button" class="tdmore" data-tdall="${key}">${open?'Show fewer':'Show all '+g.length}</button>`:''}</div>`};
  const label=d=>(d===td?'Today · ':d===yd?'Yesterday · ':'')+dayName(d);
  const dayHTML=d=>{const all=moves.filter(m=>m.date===d),list=all.filter(m=>f==='all'||mine(m));if(!list.length)return '';
    return `<section class="tdday"><h3>${esc(label(d))} <span class="hint">${list.length} move${list.length>1?'s':''}</span></h3>${TDGRP.map(x=>grp(d,list,x)).join('')}</section>`};
  const nAll=moves.length,nMine=moves.filter(mine).length;

    <h2 style="margin:0 0 4px">Today's Moves</h2>
    <p class="hint" style="margin:0 0 10px">Real MLB trades, signings and roster moves, newest day first. From MLB's official transactions, ESPN and MLB Trade Rumors, updated about every 10 minutes. <b>Reported</b> = agreed, not yet official.</p>
    ${nAll?`<div class="chips" role="group" aria-label="Filter">${btn('all','All MLB ('+nAll+')')}${btn('mine',esc(MEN())+' ('+nMine+')')}</div>`:''}

    ${body||`<p class="hint" style="margin:12px 0 0">${nAll?'No '+esc(MEN())+' moves yet this offseason.':'No real-world moves yet. They show up here as MLB and the news report them.'}</p>`}
  </div>`;
}

/* ---------- export (user's code-block format) ---------- */
function updateText(){
  const c=cbt(),t=c.total,[inc,out]=flows(),pad=(a,b,w=32)=>a.padEnd(w)+b;
  const L=[];
  L.push('HOT STOVE GM · '+MEN().toUpperCase()+' 2027','');
  L.push('TRANSACTIONS');S.log.length?S.log.forEach((l,i)=>L.push(`${i+1}. ${l.type}: ${l.text}`)):L.push('(none)');
  L.push('','CBT TRACKER (threshold $258M)',pad('Baseline',M(BASE_TOTAL())));
  S.log.forEach(l=>{if(l.inc)L.push(pad('  + '+l.type.toLowerCase(),'+'+M(l.inc)));if(l.out)L.push(pad('  - '+l.type.toLowerCase(),'-'+M(l.out)))});
  L.push(pad('Total incoming',M(inc)),pad('Total outgoing',M(out)),pad('Net change',sgn(t-BASE_TOTAL())),pad('CURRENT CBT PAYROLL',M(t)),pad('Over threshold',(t>D.threshold?'+':'')+M(t-D.threshold)),pad('Est. tax','~'+M1(tax(t))),pad('Tier',tierName(t)[0]),pad('Penalty',t>298e6?'Top pick drops 10 spots':'None (under $298M)'),pad('Room to pick-drop line ($298M)',M(298e6-t)));
  const nm=id=>id?`${P[id].n} (${hand(id)})${note(id)?'  ('+note(id)+')':''}`:'TBD';
  L.push('','PROJECTED LINEUP','');S.lineup.forEach(([p,id])=>L.push(p.padEnd(4)+nm(id)));
  L.push('');S.bench.forEach(([p,id])=>L.push(p.padEnd(4)+nm(id)));
  L.push('','STARTING ROTATION','');S.rot.forEach((id,i)=>{if(i===RN())L.push('');L.push(('SP'+(i+1)).padEnd(5)+nm(id))});
  L.push('','BULLPEN','');S.pen.forEach(([r,id])=>L.push(r.padEnd(5)+nm(id)));
  const ids=metsIds(),f40=ids.filter(id=>status(id)==='40');
  const un=f40.filter(id=>!slotOf(id));
  L.push('','!! PLAYERS TO ASSIGN');un.length?un.forEach(id=>L.push('  '+nm(id))):L.push('  (none)');
  L.push('',`40-MAN ROSTER (${f40.length}/40)`);
  const G={P:'P',C:'C',IF:'IF',OF:'OF',DH:'DH'};
  for(const g in G){const l=f40.filter(id=>grpOf(id)===g);if(l.length)L.push(`${g}(${l.length}): `+l.map(id=>P[id].n).join(', '))}
  const il=ids.filter(id=>status(id)==='IL60');if(il.length)L.push('60-day IL: '+il.map(id=>P[id].n).join(', '));
  L.push('','TOP 50 PROSPECTS');S.top.filter(isMets).slice(0,50).forEach((id,i)=>L.push(String(i+1).padStart(2)+'  '+P[id].n+'  '+P[id].pos+'  FV '+(P[id].fv||'-')+(P[id].team!==ME?'  (new)':'')));
  return L.join('\n');
}
function renderExport(){
  return `<div class="dact" style="margin-top:0"><button class="btn primary" type="button" data-act="copyupd">Copy update text</button><button class="btn primary" type="button" data-act="sendsave">Send to another device</button><button class="btn" type="button" data-act="copysave">Copy save code</button><button class="btn" type="button" data-act="loadsave">Load save code</button></div>

  <textarea class="out" id="outTxt" readonly aria-label="Update text">${esc(updateText())}</textarea>`;
}

/* a pitcher's 2026 fastball velocity: the majors if he threw 10+ innings there, else Triple-A, else any tracked minor-league park */

function fbOld(id){const vs=P[id]&&P[id].proj&&P[id].proj.vs;if(!vs||(vs[2026]&&vs[2026][0]>=10))return null;for(const y of [2025,2024])if(vs[y]&&vs[y][0]>=10&&vs[y][1]&&!(P[id].mpa||P[id].mp&&P[id].mp[5]))return [+vs[y][1],y];return null}
function fbVelo(id){const p=P[id];if(!p||!p.p)return 0;const v=p.proj&&p.proj.vs&&p.proj.vs[2026];if(v&&v[0]>=10&&v[1])return +v[1];const o=fbOld(id);if(o)return o[0];const a=p.mpa&&p.mpa[8];if(a&&(a.FA||a.SI)){const x=a.FA||a.SI;return +(Array.isArray(x)?x[0]:x)||0}return p.mp&&p.mp[5]?+p.mp[5]:0}

  if(best<0)B.lineup.forEach((x,i)=>{if(!seElig(id,x[0]))return;const g=(w(id)-w(x[1]))-(x[0]==='DH'?.4:0);if(g>gain){gain=g;best=i}});
  if(best>=0){const old=B.lineup[best][1];B.lineup[best][1]=id;toBench(old);return true}
  let k=-1;B.bench.forEach((b,j)=>{if(b[0]==='C'&&!seElig(id,'C'))return;if(k<0||w(b[1])<w(B.bench[k][1]))k=j});
  if(k>=0&&w(id)>w(B.bench[k][1])){const old=B.bench[k][1];B.bench[k][1]=id;if(B.hdep&&old)B.hdep.unshift(old);return true}return false}
const slotIn=(B,id)=>P[id]&&P[id].p?slotArm(B,id):slotBat(B,id);
/* the same for a save that was started before the move happened: once per player, so the user can move him afterwards */
function txSlotMine(){if(!S||!S.rot)return;S.txSlot=S.txSlot||{};let ch=0;for(const id of TXARMS)if(owner(id)===ME&&!S.txSlot[id]){S.txSlot[id]=1;ensureDep();if(slotIn(S,id))ch=1}if(ch){tidyDepth();save()}}
function applyTx(T){
  for(const t of (T.moves||[]))try{
    if(t.type==='trade'||t.type==='claim'){for(const m of (t.players||[{name:t.name,from:t.from,to:t.to,forty:t.forty,pos:t.pos}])){const id=findP(m.name,m.from)||mkP(m.name,m.from,m.pos);moveP(id,m.to,m.forty!==false&&t.type==='claim'?true:m.forty);if(D.teams[m.to]&&P[id].proj&&P[id].proj.war>=.5){TXARMS.push(id);slotIn(m.to==='NYM'?D:D.base[m.to],id)}}}
    else if(t.type==='sign'||t.type==='sign_minor'){let id=findP(t.name,t.team);
      /* a free agent with the same name as another club's ranked prospect is a different man: the prospect was never a free agent */
      if(id&&P[id].team!==t.team&&P[id].team!=='FA'&&P[id].mlbp&&P[id].kind==='min'&&!D.fa.includes(id))id=null;
      if(!id)id=mkP(t.name,t.team,t.pos);moveP(id,t.team,t.type==='sign'&&t.forty!==false);if(t.type==='sign'&&String(t.date||'')>='2026-10-01')TXSIGN.add(id);
      if(t.type==='sign'&&D.teams[t.team]){TXARMS.push(id);slotIn(t.team==='NYM'?D:D.base[t.team],id)}
      if(t.contract){Object.assign(P[id],{kind:'guar',aav:t.contract.aav||0,contract:t.contract.desc||'',yrs:t.contract.yrs||{}})}if(t.type==='sign_minor')P[id].lvl=P[id].lvl==='MLB'?'AAA':P[id].lvl}
    else if(t.type==='extend'||t.type==='extension'){const id=findP(t.name,t.team);/* a club extends its own player: new contract, same club, no free-agent rules */
      if(id&&P[id].team===t.team&&t.contract){Object.assign(P[id],{kind:'guar',aav:t.contract.aav||0,contract:t.contract.desc||'',yrs:t.contract.yrs||{}});if(String(t.date||'')>='2026-10-01')TXEXT.set(id,String(t.date))}}
    else if(t.type==='release'||t.type==='nontender'){const id=findP(t.name,t.team);if(id){if(P[id].kind==='guar'&&D.teams[t.team])D.teams[t.team].deadAdd=(D.teams[t.team].deadAdd||0)+(P[id].aav||0);dropFrom(id,t.team);toFA(id,t.team,t.type==='nontender')}}
    else if(t.type==='dfa'||t.type==='outright'){const id=findP(t.name,t.team);if(id){const c=t.team;if(D.fortyBy[c])D.fortyBy[c]=D.fortyBy[c].filter(x=>x!==id);if(c==='NYM')D.forty=D.forty.filter(x=>x!==id)}}
    else if(t.type==='select'){const id=findP(t.name,t.team)||mkP(t.name,t.team,t.pos);moveP(id,t.team,true);if(t.team==='NYM'){if(!D.forty.includes(id))D.forty.push(id)}else if(!D.fortyBy[t.team].includes(id))D.fortyBy[t.team].push(id)}
    else if(t.type==='retire'){const id=findP(t.name,t.team);if(id){dropFrom(id,P[id].team);D.fa=D.fa.filter(x=>x!==id);P[id].team='REL'}}/* a retired free agent leaves the free-agent pool too */
  }catch(e){console.warn('tx skipped',t,e)}
}
/* ---------- team switching ---------- */
function switchTeam(code){
  ME=code;applyColors(code);forty.clear();(code==='NYM'?D.forty:D.fortyBy[code]).forEach(id=>forty.add(id));
  IL60=new Set(D.il60By[code]||[]);
  BASE_METS=Object.keys(P).filter(id=>P[id].team===ME);
  S=baseline();BASE_T=cbt().total;
  S=load()||S;userFA();txSlotMine();HIST=[];seLoad();UI.sel=null;UI.tOut.clear();UI.tIn.clear();UI.tAdd40.clear();UI.tCash=0;
  if(UI.tTeam===ME||!D.teams[UI.tTeam])UI.tTeam=ME==='NYM'?'ATL':'NYM';
  $('#teamPick').value=ME;$('#hTeam').textContent=MEN();document.title='Virtual Hot Stove GM · '+MEN();
  try{localStorage.setItem('gm-last-team',ME)}catch(e){}
  render();
}
/* ---------- boot ---------- */
fetch('data.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(async d=>{
  D=d;P=d.players;
  try{const r=await fetch('transactions.json',{cache:'no-store'});if(r.ok){D.tx=await r.json();applyTx(D.tx)}}catch(e){D.tx=null}
  try{const r=await fetch('intel.json',{cache:'no-store'});if(r.ok){INTEL=await r.json();applyIntel()}}catch(e){INTEL=null}
  try{const r=await fetch('profiles.json',{cache:'no-store'});if(r.ok){PROFILES=await r.json();_vw={}}}catch(e){PROFILES=null}
  try{const r=await fetch('defense.json',{cache:'no-cache'});if(r.ok){DEF=await r.json();_vw={}}}catch(e){DEF=null}
  try{const r=await fetch('draft.json',{cache:'no-cache'});if(r.ok)drInit(await r.json())}catch(e){DR=null}
  try{const r=await fetch('season.json',{cache:'no-cache'});if(r.ok)SN=await r.json()}catch(e){SN=null}
  const imported=await importFromHash();
  let last='NYM';try{last=localStorage.getItem('gm-last-team')||'NYM'}catch(e){}
  const codes=Object.keys(d.teams).sort((a,b)=>d.teams[a].name.localeCompare(d.teams[b].name));
  $('#teamPick').innerHTML=codes.map(c=>`<option value="${c}">${esc(d.teams[c].name)}</option>`).join('');
  $('#teamPick').onchange=e=>switchTeam(e.target.value);
  switchTeam(d.teams[last]?last:'NYM');
  loadNews();setInterval(loadNews,5*60*1000);loadMeta();loadExtra();
  if(imported)toast('Saves loaded from your other device');
}).catch(err=>{$('#app').innerHTML=`<div class="loading">The roster data didn't load (${esc(err.message)}). Reload the page to try again.</div>`});
</script>
